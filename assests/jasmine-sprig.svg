<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!-- Watercolour-style jasmine sprig that grows from the top-right corner down to the left.
       Flip or rotate it with CSS for the other corners. -->
  <defs>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f8a5c"/>
      <stop offset=".55" stop-color="#93ab7d"/>
      <stop offset="1" stop-color="#b9cba4"/>
    </linearGradient>
    <linearGradient id="leafPale" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9fb58a"/>
      <stop offset="1" stop-color="#d3dec4"/>
    </linearGradient>
    <radialGradient id="petal" cx=".5" cy=".85" r=".9">
      <stop offset="0" stop-color="#fffef8"/>
      <stop offset=".7" stop-color="#fbfaf2"/>
      <stop offset="1" stop-color="#e6ebda"/>
    </radialGradient>
    <radialGradient id="wash" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#b9c8a5" stop-opacity=".55"/>
      <stop offset="1" stop-color="#b9c8a5" stop-opacity="0"/>
    </radialGradient>
    <filter id="paint" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>

    <g id="leafShape">
      <path d="M0 0C10-11 33-12 50 0 33 10 11 10 0 0Z" fill="url(#leaf)"/>
      <path d="M2 0C17-1 32-1 47 0" stroke="#e4ecd8" stroke-width=".9" fill="none" opacity=".7"/>
    </g>
    <g id="leafSoft">
      <path d="M0 0C10-11 33-12 50 0 33 10 11 10 0 0Z" fill="url(#leafPale)"/>
    </g>
    <g id="flower">
      <g stroke="#cfd7c2" stroke-width=".7" fill="url(#petal)">
        <path d="M0 0C-8-7-8-21 0-25 8-21 8-7 0 0Z"/>
        <path d="M0 0C-8-7-8-21 0-25 8-21 8-7 0 0Z" transform="rotate(72)"/>
        <path d="M0 0C-8-7-8-21 0-25 8-21 8-7 0 0Z" transform="rotate(144)"/>
        <path d="M0 0C-8-7-8-21 0-25 8-21 8-7 0 0Z" transform="rotate(216)"/>
        <path d="M0 0C-8-7-8-21 0-25 8-21 8-7 0 0Z" transform="rotate(288)"/>
      </g>
      <circle r="4.2" fill="#eadca0"/>
      <g fill="#c9a64b">
        <circle cx="-2" cy="-1.5" r="1.1"/><circle cx="1.8" cy="-1.8" r="1.1"/>
        <circle cx="2.2" cy="1.6" r="1.1"/><circle cx="-1.6" cy="2" r="1.1"/><circle r="1"/>
      </g>
    </g>
    <g id="bud">
      <path d="M0 0C-5-6-5-15 0-19 5-15 5-6 0 0Z" fill="url(#petal)" stroke="#cfd7c2" stroke-width=".7"/>
      <path d="M0 2C-4-1-4-5 0-6 4-5 4-1 0 2Z" fill="#8ea578"/>
    </g>
  </defs>

  <!-- soft watercolour wash behind the sprig -->
  <ellipse cx="230" cy="80" rx="110" ry="80" fill="url(#wash)" filter="url(#soft)"/>
  <ellipse cx="120" cy="210" rx="70" ry="60" fill="url(#wash)" filter="url(#soft)" opacity=".7"/>

  <g filter="url(#paint)">
    <!-- pale background leaves -->
    <use href="#leafSoft" transform="translate(318 60) rotate(160) scale(1.3)" opacity=".55"/>
    <use href="#leafSoft" transform="translate(245 140) rotate(120) scale(1.1)" opacity=".5"/>
    <use href="#leafSoft" transform="translate(190 20) rotate(185) scale(1.2)" opacity=".45"/>

    <!-- stems -->
    <path d="M330-5C262 40 200 92 152 168S80 270 38 312" stroke="#7d9367" stroke-width="2.2" fill="none" stroke-linecap="round" opacity=".8"/>
    <path d="M300 12C252 30 205 32 140 50" stroke="#7d9367" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".75"/>
    <path d="M220 96C230 82 236 76 238 70M152 168C134 186 122 200 118 214" stroke="#7d9367" stroke-width="1.3" fill="none" stroke-linecap="round" opacity=".7"/>

    <!-- leaves along the main stem -->
    <use href="#leafShape" transform="translate(292 24) rotate(98) scale(1.26)"/>
    <use href="#leafShape" transform="translate(262 48) rotate(192) scale(1.38)"/>
    <use href="#leafShape" transform="translate(228 88) rotate(102) scale(1.44)"/>
    <use href="#leafShape" transform="translate(198 120) rotate(188) scale(1.32)"/>
    <use href="#leafShape" transform="translate(166 156) rotate(96) scale(1.20)"/>
    <use href="#leafShape" transform="translate(138 190) rotate(200) scale(1.14)"/>
    <use href="#leafShape" transform="translate(106 234) rotate(112) scale(1.02)"/>
    <use href="#leafShape" transform="translate(78 270) rotate(204) scale(0.90)"/>
    <!-- leaves along the top stem -->
    <use href="#leafShape" transform="translate(252 26) rotate(212) scale(1.08)"/>
    <use href="#leafShape" transform="translate(208 36) rotate(160) scale(1.14)"/>
    <use href="#leafShape" transform="translate(172 44) rotate(205) scale(0.96)"/>

    <!-- jasmine flowers and buds -->
    <use href="#flower" transform="translate(236 70) rotate(12) scale(1.52)"/>
    <use href="#flower" transform="translate(264 96) rotate(-20) scale(1.23)"/>
    <use href="#flower" transform="translate(204 58) rotate(30) scale(1.04)"/>
    <use href="#flower" transform="translate(146 48) rotate(8) scale(1.13)"/>
    <use href="#flower" transform="translate(118 214) rotate(-6) scale(1.38)"/>
    <use href="#flower" transform="translate(92 192) rotate(24) scale(0.99)"/>
    <use href="#bud" transform="translate(180 140) rotate(-35) scale(1.3)"/>
    <use href="#bud" transform="translate(126 42) rotate(-70) scale(1.10)"/>
    <use href="#bud" transform="translate(58 292) rotate(-40) scale(1.10)"/>
    <use href="#bud" transform="translate(286 70) rotate(20) scale(1.04)"/>
  </g>
</svg>
