<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css"><style>
html,body{margin:0;width:720px;height:1280px;overflow:hidden;background:#e6eadb}.scene{position:relative;width:720px;height:1280px;background:linear-gradient(#f7f4e9dd,#f7f4e9dd),url('assests/card1.jpg') center/cover}.frame{position:absolute;inset:45px;border:1px solid #a49770;padding:75px 38px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}.frame:before{content:'';position:absolute;inset:10px;border:1px solid #bdc2ac;pointer-events:none}.floral{position:absolute;bottom:-35px;left:-25px;width:300px;mix-blend-mode:multiply;opacity:.5}.top-floral{position:absolute;top:-40px;right:-60px;width:320px;mix-blend-mode:multiply;opacity:.35;transform:rotate(180deg)}.frame .eyebrow{font-size:12px;letter-spacing:4px;position:relative}.frame .welcome{font-size:28px;margin-top:40px}.names{font:76px/1.08 Georgia,serif;position:relative;color:#3d4939}.names span{display:block}.names em{display:block;font-size:43px;color:#a58b58;margin:12px}.si-names{font-size:30px;margin:30px 0 20px}.frame .rule{height:1px;width:70px;background:#a38c58;margin:20px 0}.date{font:29px Georgia;letter-spacing:3px;margin:12px 0}.si-date{font-size:25px;margin:10px 0}.details{font-size:15px;letter-spacing:1px;margin:10px 0}.venue-name{font:28px Georgia;margin:20px 0 0}.sample{position:absolute;bottom:30px;font-size:9px;letter-spacing:2px;color:#68705c}.panel{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(#7f91675c,#7f91675c),url('assests/card2.jpg') center/cover;box-shadow:0 0 30px #29342266}.panel:after{content:'';position:absolute;inset:22px;border:1px solid #d5d8b9aa}.left{left:0;border-right:2px solid #b4ae83}.right{right:0;background-position:80% center;border-left:2px solid #b4ae83}.seal{position:absolute;top:535px;left:275px;width:170px;height:170px;background:radial-gradient(circle at 33% 28%,#e6d2a1,#b49253 65%,#8f713f);border:6px double #e2c990;outline:2px solid #947743;border-radius:50%;box-shadow:0 9px 22px #26332155;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#695126;font:38px Georgia}.seal small{font:9px 'Segoe UI';letter-spacing:3px;margin-top:8px}.cover-caption{position:absolute;top:800px;left:0;width:100%;text-align:center;color:#f8f5e6;text-shadow:0 1px 4px #24391e;font-size:13px;letter-spacing:4px}.cover-caption span{display:block;font-size:24px;margin-top:15px;letter-spacing:0}
</style></head><body><div class="scene"><img class="top-floral" src="assests/flower.jpg" alt=""><img class="floral" src="assests/flower.jpg" alt=""><div class="frame"><p class="eyebrow">Together, a beautiful beginning</p><p class="welcome sinhala" lang="si" id="welcome"></p><div class="names"><span id="first"></span><em>&</em><span id="second"></span></div><p class="si-names sinhala" lang="si" id="names-si"></p><div class="rule"></div><p class="date" id="date"></p><p class="si-date sinhala" lang="si" id="date-si"></p><p class="details" id="ceremony"></p><p class="venue-name" id="venue"></p><p class="details" id="location"></p><p class="sample">SAMPLE INVITATION · FICTIONAL WEDDING DETAILS</p></div><div class="panel left"></div><div class="panel right"></div><div class="seal"><span id="initials"></span><small>WITH LOVE</small></div><div class="cover-caption">YOU ARE INVITED<span lang="si" class="sinhala">ආදරයෙන් ඇරයුම් කරමු</span></div></div><script type="module">
import {invitation as c} from './invitation.config.js';
for(const [id,value] of Object.entries({welcome:c.welcome,first:c.names.first,second:c.names.second,'names-si':c.names.sinhala,date:c.date.english,'date-si':c.date.sinhala,ceremony:`${c.schedule[1].en} · ${c.schedule[1].time}`,venue:c.venue.name,location:c.venue.location,initials:`${c.names.first[0]} & ${c.names.second[0]}`}))document.getElementById(id).textContent=value;
window.renderFrame=(t)=>{const p=Math.max(0,Math.min(1,(t-1.5)/3.3));const eased=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;document.querySelector('.left').style.transform=`translateX(${-eased*105}%)`;document.querySelector('.right').style.transform=`translateX(${eased*105}%)`;document.querySelector('.seal').style.opacity=1-Math.min(1,p*4);document.querySelector('.seal').style.transform=`scale(${1-p*.25})`;document.querySelector('.cover-caption').style.opacity=1-Math.min(1,p*4);};window.renderFrame(0);window.sceneReady=true;
</script></body></html>
